<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e0d">
  <meta name="description" content="BLACKBOX مساحة تدريب عملية: مسارات واضحة، متابعة للتقدم، وملاحظات وتقارير قابلة للحفظ والاستعادة.">
  <title>BLACKBOX | مساحة التدريب السيبراني</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">تجاوز إلى المحتوى</a>
  <div class="app">
    <aside class="sidebar" aria-label="التنقل الرئيسي">
      <a class="brand" href="./" aria-label="BLACKBOX — لوحة التحكم">
        <span class="brand-icon" aria-hidden="true">B.</span>
        <span><strong>BLACKBOX</strong><small>TRAINING WORKSPACE</small></span>
      </a>
      <div class="sidebar-section">
        <div class="nav-title">مساحة العمل</div>
        <nav class="nav" id="nav" aria-label="أقسام المختبر">
          <button type="button" data-view="home"><span class="ic" aria-hidden="true">◈</span><span>لوحة التحكم</span></button>
          <button type="button" data-view="tracks"><span class="ic" aria-hidden="true">▤</span><span>مسارات التدريب</span></button>
          <button type="button" data-view="journal"><span class="ic" aria-hidden="true">▧</span><span>سجل المختبر</span></button>
          <button type="button" data-view="backups"><span class="ic" aria-hidden="true">↓</span><span>النسخ والتقارير</span></button>
          <button type="button" data-view="troubleshoot"><span class="ic" aria-hidden="true">⌁</span><span>حلول الأعطال</span></button>
        </nav>
      </div>
      <div class="side-bottom">
        <section class="side-progress" aria-label="ملخص تقدمك"><span>رحلتك في المختبر</span><strong id="sideProgress">0 / 18</strong><progress id="sideProgressBar" max="18" value="0">0</progress><small>مراحل أكّدت إنجازها</small></section>
        <div class="profile"><span class="avatar" aria-hidden="true">BB</span><div><b>مساحتك الخاصة</b><small>البيانات محفوظة على هذا المتصفح</small></div></div>
      </div>
    </aside>
    <main class="main" id="main-content" tabindex="-1">
      <header class="topbar">
        <div class="crumb"><span class="mono">BLACKBOX</span><span aria-hidden="true"> / </span><b id="crumb">لوحة التحكم</b></div>
        <div class="right-actions"><span class="save-status" id="saveStatus" role="status" aria-live="polite">جارٍ تحميل تقدمك</span><button type="button" class="secondary compact" id="quickBackup">تنزيل نسخة</button></div>
      </header>
      <div id="storageNotice" class="storage-notice hidden" role="status"></div>
      <div id="content"></div>
      <footer class="footer">BLACKBOX · تعلّم، وثّق، وراجع تقدّمك · حفظ محلي دون مزامنة بين الأجهزة</footer>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
