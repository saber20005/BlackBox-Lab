name: BLACKBOX quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline application tests
        run: node --test --test-isolation=none tests/*.test.mjs
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: |
          mkdir -p /tmp/blackbox-firebase-rules-test
          npm install --prefix /tmp/blackbox-firebase-rules-test --no-audit --no-fund firebase@13 @firebase/rules-unit-testing@6 firebase-tools
      - name: Test Firestore rules against local emulator
        env:
          BLACKBOX_FIREBASE_TEST_DEPS: /tmp/blackbox-firebase-rules-test
        run: |
          /tmp/blackbox-firebase-rules-test/node_modules/.bin/firebase emulators:exec --project demo-blackbox-account-tests --only firestore 'node --test --test-isolation=none tests/firestore-rules.test.mjs'
