name: BLACKBOX quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check browser module syntax
        run: |
          node --check app.js
          node --check verified-grading-client.js
      - name: Run offline application tests
        run: |
          node --test --test-isolation=none tests/*.test.mjs
          node --test functions/tests/*.test.mjs

  guest-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test dependency
        run: npm install --prefix /tmp/blackbox-playwright --no-audit --no-fund --no-package-lock playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: node /tmp/blackbox-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify desktop/mobile journeys and startup loading
        env:
          BLACKBOX_PLAYWRIGHT_MODULE: /tmp/blackbox-playwright/node_modules/playwright/index.mjs
          BLACKBOX_BROWSER_ARTIFACTS: /tmp/blackbox-browser-artifacts
        run: |
          node scripts/test-guest-browser.mjs
          node scripts/test-loading-browser.mjs
      - name: Upload guest browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-browser-failure
          path: /tmp/blackbox-browser-artifacts
          if-no-files-found: ignore

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: |
          mkdir -p /tmp/blackbox-firebase-rules-test
          npm install --prefix /tmp/blackbox-firebase-rules-test --no-audit --no-fund firebase@13 @firebase/rules-unit-testing@6 firebase-admin@13 firebase-tools
      - name: Test Firestore rules against local emulator
        env:
          BLACKBOX_FIREBASE_TEST_DEPS: /tmp/blackbox-firebase-rules-test
        run: |
          /tmp/blackbox-firebase-rules-test/node_modules/.bin/firebase emulators:exec --project demo-blackbox-account-tests --only firestore 'node --test --test-isolation=none tests/firestore-rules.test.mjs functions/tests/grading-emulator.test.mjs'

  callable-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Functions and Firebase CLI dependencies
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix /tmp/blackbox-firebase-cli --no-audit --no-fund firebase-tools
      - name: Verify anonymous callable requests are denied
        env:
          FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
          GCLOUD_PROJECT: demo-blackbox-account-tests
        run: |
          /tmp/blackbox-firebase-cli/node_modules/.bin/firebase emulators:exec --project demo-blackbox-account-tests --only auth,firestore,functions 'node --test functions/tests/callable-emulator.test.mjs'
