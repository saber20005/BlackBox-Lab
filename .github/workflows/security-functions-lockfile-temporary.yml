# Temporary: regenerate lock after Firebase Admin major upgrade; remove after commit.
name: BLACKBOX one-time Firebase Admin lock refresh
on:
  push:
    branches: [security/isolated-trust-boundary-audit-20261123]
    paths:
      - functions/package.json
      - .github/workflows/security-functions-lockfile-temporary.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'saber20005/BlackBox-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/isolated-trust-boundary-audit-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lock without executing dependency lifecycle scripts
        run: npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm patched modular Admin SDK and Functions compatibility
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('functions/package-lock.json','utf8')).packages;
          const a=p['node_modules/firebase-admin']?.version;
          const f=p['node_modules/firebase-functions']?.version;
          console.log(JSON.stringify({admin:a,functions:f}));
          if(!a?.startsWith('14.') || !f?.startsWith('7.')) process.exit(1);
          JS
      - name: Push only regenerated Functions lockfile
        run: |
          git add -- functions/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): lock Firebase Admin 14 patched dependency tree'
          git push origin HEAD:refs/heads/security/isolated-trust-boundary-audit-20261123
