# One-time, branch-specific server dependency lock generation. Remove once committed.
name: BLACKBOX one-time Functions lockfile
on:
  push:
    branches: [security/isolated-trust-boundary-audit-20261123]
    paths:
      - .github/workflows/security-functions-lockfile-temporary.yml

permissions:
  contents: write
jobs:
  generate-lock:
    if: github.repository == 'saber20005/BlackBox-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/isolated-trust-boundary-audit-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Produce lockfile without install lifecycle scripts
        run: npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Inspect resolved backend dependency versions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('functions/package-lock.json','utf8'));
          console.log(JSON.stringify({admin:p.packages?.['node_modules/firebase-admin']?.version,
            functions:p.packages?.['node_modules/firebase-functions']?.version}));
          if(!p.packages?.['node_modules/firebase-admin']||!p.packages?.['node_modules/firebase-functions'])process.exit(1);
          JS
      - name: Commit only backend lockfile
        run: |
          git add -- functions/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): lock backend Firebase Functions dependencies'
          git push origin HEAD:refs/heads/security/isolated-trust-boundary-audit-20261123
