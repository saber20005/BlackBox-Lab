name: BLACKBOX backend dependency audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  functions-npm-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked backend dependencies without lifecycle scripts
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Audit deployed backend package tree
        run: |
          npm audit --prefix functions --omit=dev --json > /tmp/blackbox-functions-audit.json || true
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync('/tmp/blackbox-functions-audit.json','utf8'));
          console.log('BLACKBOX Functions npm audit counts: '+JSON.stringify(result.metadata?.vulnerabilities??{}));
          for(const [name,v] of Object.entries(result.vulnerabilities??{}).sort((a,b)=>a[0].localeCompare(b[0]))) {
            console.log(name+' ['+v.severity+'] '+JSON.stringify({isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}));
          }
          if(result.error){
            console.error('npm audit unavailable: '+JSON.stringify(result.error).slice(0,300));
            process.exitCode=1;
          }
          const counts=result.metadata?.vulnerabilities??{};
          if((counts.high??0)+(counts.critical??0)>0){
            console.error('High/critical backend dependencies detected; fail the security gate.');
            process.exitCode=1;
          }
          JS
